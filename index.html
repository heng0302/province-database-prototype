<style>

  .pgs-profile-overlay{ position:fixed; inset:0; background:rgba(13,17,23,0.6); backdrop-filter:blur(3px); display:flex; align-items:flex-start;

  .pgs-profile-header{ background:linear-gradient(135deg, var(--navy), var(--navy-dark)); color:#fff; padding:26px 66px 22px 32px;
    position:relative; overflow:hidden; border-bottom:4px solid var(--gold); }

  .pgs-profile-minimap{ height:160px; border-radius:12px; border:1px solid var(--line); background:var(--paper-alt); }
  .pgs-profile-map-link{ position:absolute; left:9px; right:9px; bottom:9px; z-index:400; display:flex; align-items:center; justify-content:center;

  .pgs-profile-section-head{ display:flex; align-items:center; gap:8px; background:var(--paper-alt); padding:12px 18px;
    font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--navy-dark); border-bottom:1px solid var(--line); }
  .pgs-profile-section-head .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .pgs-profile-grid{ display:grid; grid-template-columns:1fr 1fr; }

<div class="pgs-login-wrap" id="pgsLoginWrap">
  <div class="pgs-login-card">
    <div class="pgs-eyebrow">ប្រព័ន្ធគ្រប់គ្រងទិន្នន័យខេត្តតាកែវ</div>

      <div class="pgs-login-field">
        <label>Username</label>
        <input type="text" id="pgsUsername" autocomplete="username" required>

      <div class="pgs-login-field">
        <label>Password</label>

</div>

  // Parses dates in either ISO (YYYY-MM-DD) or M/D/YYYY form. Returns null if unparseable.
  function parseFlexibleDate(s){
    if(s==null || s==='') return null;
    s = String(s).trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if(m){ const dt = new Date(+m[1], +m[2]-1, +m[3]); return isNaN(dt.getTime())?null:dt; }
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if(m){ let yr = +m[3]; if(yr<100) yr += 2000; const dt = new Date(yr, +m[1]-1, +m[2]); return isNaN(dt.getTime())?null:dt; }
    const dt = new Date(s);
    return isNaN(dt.getTime()) ? null : dt;
  }

  // Returns a department's records narrowed to the active governor/department date-range filter.
  // Records with an unparseable/missing date are kept (so messy source data isn't silently hidden).
  function filteredRecords(deptKey){
    const list = state.records[deptKey] || [];
    if(!state.dateFrom && !state.dateTo) return list;
    const dateKey = DATE_FIELDS[deptKey];
    if(!dateKey) return list;
    const from = state.dateFrom ? new Date(state.dateFrom+'T00:00:00') : null;
    const to = state.dateTo ? new Date(state.dateTo+'T23:59:59') : null;
    return list.filter(r=>{
      const dt = parseFlexibleDate(r[dateKey]);
      if(!dt) return true;
      if(from && dt < from) return false;
      if(to && dt > to) return false;
      return true;
    });
  }

  function numVal(v){ if(v==null || v==='') return 0; const n = Number(v); return isNaN(n)?0:n; }
  function fmt(n){ return Math.round(n).toLocaleString(); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]); }

  // Same font stack as .pgs-root in the CSS. Canvas text doesn't inherit CSS, so every
  // ctx.font assignment below must repeat this explicitly to keep Khmer labels visually
  // consistent with the rest of the page (cards, table, headings).
  const PGS_FONT_STACK = "Inter, 'Noto Sans Khmer', 'Khmer Sangam MN', 'Khmer OS', 'Leelawadee UI', sans-serif";

  // ---------- LIGHTWEIGHT CANVAS CHARTS (no external chart library required) ----------
  // Sizes a canvas's backing store to match its CSS box at the current device pixel ratio,
  // so charts stay crisp and correctly positioned regardless of container size.
  function fitCanvas(canvas){
    const box = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(60, Math.round(box.width));
    const h = Math.max(60, Math.round(box.height));
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w, h };
  }
  function roundRect(ctx, x, y, w, h, r){
    if(w<0){ x+=w; w=Math.abs(w); }
    if(h<0){ y+=h; h=Math.abs(h); }
    r = Math.max(0, Math.min(r, w/2, h/2));
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }
  function ellipsize(ctx, text, maxWidth){
    text = String(text);
    if(ctx.measureText(text).width<=maxWidth) return text;
    while(text.length>1 && ctx.measureText(text+'…').width>maxWidth){ text = text.slice(0,-1); }
    return text+'…';
  }
  // Re-renders a chart whenever its panel is resized (window resize, tab switch, etc.)
  // and cleans itself up once the canvas is removed from the document.
  function observeAndRender(canvas, render){
    render();
    const ro = new ResizeObserver(()=>{
      if(!document.body.contains(canvas)){ ro.disconnect(); return; }
      render();
    });
    ro.observe(canvas.parentElement);
  }
  function emptyState(ctx, w, h){
    ctx.fillStyle = '#8A8474'; ctx.font = '12px ' + PGS_FONT_STACK;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('No data for this selection', w/2, h/2);
  }

  function drawBar(_id, canvas, labels, data, seriesLabel, color, horizontal){
    observeAndRender(canvas, function(){
      const { ctx, w, h } = fitCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      if(!labels.length){ emptyState(ctx,w,h); return; }
      const max = Math.max(1, ...data.map(v=>v||0));
      if(horizontal){
        const pad = 6;
        const labelW = Math.min(150, Math.round(w*0.34));
        const rowH = Math.max(15, Math.min(30, (h-pad*2)/labels.length));
        const barAreaW = Math.max(20, w-labelW-64);
        ctx.font = '11px ' + PGS_FONT_STACK;
        labels.forEach((lab,i)=>{
          const y = pad+i*rowH;
          if(y+rowH>h) return;
          ctx.fillStyle = '#2A2A28'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
          ctx.fillText(ellipsize(ctx, lab, labelW-8), labelW, y+rowH/2);
          const val = data[i]||0;
          const barW = Math.max(val>0?2:0, (val/max)*barAreaW);
          const barH = Math.max(6, rowH-7);
          ctx.fillStyle = color;
          roundRect(ctx, labelW+6, y+(rowH-barH)/2, barW, barH, 3);
          ctx.fill();
          ctx.fillStyle = '#6B655A'; ctx.textAlign = 'left';
          ctx.fillText(fmt(val), labelW+10+barW, y+rowH/2);
        });
      } else {
        const pad = 8, bottomH = 44;
        const barAreaH = Math.max(20, h-bottomH-pad);
        const slotW = (w-pad*2)/labels.length;
        const barW = Math.max(6, slotW-10);
        ctx.font = '10px ' + PGS_FONT_STACK;
        // Pre-measure the value labels: if a label is wider than the slot it sits in,
        // two neighboring numbers can print on top of each other. When that risk exists,
        // stagger labels across two vertical tiers (alternating) so no two numbers overlap.
        const valTexts = data.map(v=>fmt(v||0));
        const maxLabelW = Math.max(0, ...valTexts.map(t=>ctx.measureText(t).width));
        const stagger = maxLabelW > slotW - 6;
        labels.forEach((lab,i)=>{
          const x = pad+i*slotW;
          const val = data[i]||0;
          const barH = Math.max(val>0?2:0, (val/max)*barAreaH);
          ctx.fillStyle = color;
          roundRect(ctx, x+(slotW-barW)/2, pad+barAreaH-barH, barW, barH, 3);
          ctx.fill();
          ctx.fillStyle = '#6B655A'; ctx.textAlign = 'center';
          const tierOffset = stagger && (i%2===1) ? 12 : 0;
          const labelY = Math.max(10, pad+barAreaH-barH-6-tierOffset);
          ctx.fillText(valTexts[i], x+slotW/2, labelY);
          ctx.save();
          ctx.translate(x+slotW/2, pad+barAreaH+8);
          ctx.rotate(-Math.PI/6);
          ctx.textAlign = 'right'; ctx.fillStyle = '#2A2A28'; ctx.font = '10px ' + PGS_FONT_STACK;
          ctx.fillText(ellipsize(ctx, lab, 74), 0, 0);
          ctx.restore();
        });
      }
    });
  }

  // Draws one or more trend lines. Each series: {label, color, data:[v,...], projectedFrom: idx}
  // Points at index >= projectedFrom are rendered dashed/hollow to distinguish forecast from actuals.
  function drawLine(canvas, labels, series, yPrefix){
    observeAndRender(canvas, function(){
      const { ctx, w, h } = fitCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      if(!labels.length){ emptyState(ctx,w,h); return; }
      const legendH = 22, padL = 44, padR = 14, padT = 14, bottomH = 30;
      const chartW = Math.max(20, w-padL-padR);
      const chartH = Math.max(20, h-padT-bottomH-legendH);
      const allVals = series.flatMap(s=>s.data.filter(v=>v!=null));
      const maxV = Math.max(1, ...allVals);
      const minV = Math.min(0, ...allVals);
      const xStep = labels.length>1 ? chartW/(labels.length-1) : 0;
      function xAt(i){ return padL + i*xStep; }
      function yAt(v){ return padT + chartH - ((v-minV)/(maxV-minV||1))*chartH; }
      // gridlines
      ctx.strokeStyle = '#E7E1D2'; ctx.lineWidth = 1; ctx.font = '10px ' + PGS_FONT_STACK;
      ctx.fillStyle = '#8A8474'; ctx.textAlign='right'; ctx.textBaseline='middle';
      let lastLabelY = null;
      for(let g=0; g<=3; g++){
        const v = minV + (maxV-minV)*g/3;
        const y = yAt(v);
        ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+chartW,y); ctx.stroke();
        // Skip the number if it would land within one text-line's height of the
        // previous gridline number, so two values never print on top of each other.
        if(lastLabelY==null || Math.abs(y-lastLabelY)>=11){
          ctx.fillText((yPrefix||'')+fmt(v), padL-6, y);
          lastLabelY = y;
        }
      }
      // x labels
      ctx.textAlign='center'; ctx.textBaseline='top';
      labels.forEach((lab,i)=>{ ctx.fillStyle='#2A2A28'; ctx.fillText(lab, xAt(i), padT+chartH+8); });
      // lines
      series.forEach(s=>{
        const projFrom = s.projectedFrom!=null ? s.projectedFrom : labels.length;
        // solid actual segment
        ctx.strokeStyle = s.color; ctx.lineWidth = 2.2; ctx.beginPath();
        let started=false;
        s.data.forEach((v,i)=>{
          if(v==null || i>projFrom) return;
          const x=xAt(i), y=yAt(v);
          if(!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
        });
        ctx.stroke();
        // dashed projected segment
        if(projFrom < labels.length-1 || (projFrom===labels.length-1 && s.data[projFrom+1]!=null)){
          ctx.save(); ctx.setLineDash([5,4]); ctx.strokeStyle = s.color; ctx.globalAlpha=0.75;
          ctx.beginPath(); let started2=false;
          s.data.forEach((v,i)=>{
            if(v==null || i<projFrom) return;
            const x=xAt(i), y=yAt(v);
            if(!started2){ ctx.moveTo(x,y); started2=true; } else ctx.lineTo(x,y);
          });
          ctx.stroke(); ctx.restore();
        }
        // dots
        s.data.forEach((v,i)=>{
          if(v==null) return;
          const x=xAt(i), y=yAt(v), proj = i>=projFrom;
          ctx.beginPath(); ctx.arc(x,y, proj?3.5:3.2, 0, Math.PI*2);
          if(proj){ ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=1.6; ctx.strokeStyle=s.color; ctx.stroke(); }
          else { ctx.fillStyle=s.color; ctx.fill(); }
        });
      });
      // legend
      let lx = padL, ly = padT+chartH+bottomH+6;
      ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.font='10.5px '+PGS_FONT_STACK;
      series.forEach(s=>{
        ctx.strokeStyle = s.color; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx+16,ly); ctx.stroke();
        ctx.fillStyle = '#2A2A28';
        const text = s.label+(s.projectedFrom!=null?' (dashed = projected)':'');
        ctx.fillText(text, lx+21, ly);
        lx += 21+ctx.measureText(text).width+18;
      });
    });
  }

  // Simple least-squares linear regression over integer x (years) -> y. Returns {slope, intercept, predict(x)}.
  function linearRegression(points){
    const n = points.length;
    if(n<2) return { slope:0, intercept: n===1?points[0][1]:0, predict:(x)=> n===1?points[0][1]:0 };
    const sx = points.reduce((s,p)=>s+p[0],0), sy = points.reduce((s,p)=>s+p[1],0);
    const sxx = points.reduce((s,p)=>s+p[0]*p[0],0), sxy = points.reduce((s,p)=>s+p[0]*p[1],0);
    const denom = (n*sxx - sx*sx) || 1;
    const slope = (n*sxy - sx*sy)/denom;
    const intercept = (sy - slope*sx)/n;
    return { slope, intercept, predict:(x)=> slope*x+intercept };
  }

  // Groups a department's records by the year of a given date/year field.
  // dateField values may be full dates (M/D/YYYY) or a bare year number (MISTI's "Year").
  function yearOf(v){
    if(v==null || v==='') return null;
    if(typeof v==='number') return v;
    const s = String(v).trim();
    if(/^\d{4}$/.test(s)) return +s;
    const dt = parseFlexibleDate(s);
    return dt ? dt.getFullYear() : null;
  }
  function groupByYear(list, dateField, valueFields){
    // valueFields: {resultKey: recordKey} — sums each recordKey per year, plus 'count'.
    const out = {};
    list.forEach(r=>{
      const yr = yearOf(r[dateField]);
      if(!yr) return;
      if(!out[yr]) out[yr] = { count:0 };
      out[yr].count++;
      Object.entries(valueFields||{}).forEach(([rk,fk])=>{ out[yr][rk] = (out[yr][rk]||0) + numVal(r[fk]); });
    });
    return out;
  }

  function drawStackedBar(canvas, labels, datasets){
    observeAndRender(canvas, function(){
      const { ctx, w, h } = fitCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      if(!labels.length){ emptyState(ctx,w,h); return; }
      const legendRows = Math.ceil(datasets.length/3);
      const legendH = 16+legendRows*16;
      const pad = 8, bottomH = 44;
      const barAreaH = Math.max(20, h-bottomH-pad-legendH);
      const slotW = (w-pad*2)/labels.length;
      const barW = Math.max(6, slotW-10);
      const totals = labels.map((_,li)=> datasets.reduce((s,ds)=>s+(ds.data[li]||0),0));
      const max = Math.max(1, ...totals);
      ctx.font = '10px ' + PGS_FONT_STACK;
      labels.forEach((lab,li)=>{
        const x = pad+li*slotW;
        let yCursor = pad+barAreaH;
        datasets.forEach(ds=>{
          const val = ds.data[li]||0;
          if(val<=0) return;
          const segH = (val/max)*barAreaH;
          ctx.fillStyle = ds.backgroundColor;
          ctx.fillRect(x+(slotW-barW)/2, yCursor-segH, barW, segH);
          yCursor -= segH;
        });
        ctx.save();
        ctx.translate(x+slotW/2, pad+barAreaH+8);
        ctx.rotate(-Math.PI/6);
        ctx.textAlign = 'right'; ctx.fillStyle = '#2A2A28';
        ctx.fillText(ellipsize(ctx, lab, 74), 0, 0);
        ctx.restore();
      });
      // legend
      let lx = pad, ly = h-legendH+10;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = '10px ' + PGS_FONT_STACK;
      datasets.forEach((ds,i)=>{
        const text = ds.label;
        const textW = ctx.measureText(text).width;
        const itemW = 16+textW+18;
        if(lx+itemW>w-pad){ lx = pad; ly += 16; }
        ctx.fillStyle = ds.backgroundColor;
        ctx.beginPath(); ctx.arc(lx+4, ly, 4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#2A2A28';
        ctx.fillText(text, lx+12, ly);
        lx += itemW;
      });
    });
  }

  function drawPie(_id, canvas, labels, data){
    observeAndRender(canvas, function(){
      const { ctx, w, h } = fitCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const total = data.reduce((a,b)=>a+(b||0),0);
      if(!labels.length || total<=0){ emptyState(ctx,w,h); return; }
      const cols = w>340 ? 2 : 1;
      const legendRows = Math.ceil(labels.length/cols);
      const legendH = Math.min(h*0.5, 14+legendRows*17);
      const chartH = h-legendH;
      const cx = w/2, cy = chartH/2;
      const r = Math.max(16, Math.min(cx, cy)-8);
      let start = -Math.PI/2;
      labels.forEach((lab,i)=>{
        const val = data[i]||0;
        const angle = (val/total)*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,start,start+angle);
        ctx.closePath();
        ctx.fillStyle = CATEGORY_PALETTE[i % CATEGORY_PALETTE.length];
        ctx.fill();
        start += angle;
      });
      // legend, wrapped into `cols` columns
      const colW = w/cols;
      ctx.font = '11px ' + PGS_FONT_STACK; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      let col = 0, y = chartH+16;
      labels.forEach((lab,i)=>{
        const val = data[i]||0; const pct = Math.round((val/total)*100);
        const x = col*colW+8;
        ctx.fillStyle = CATEGORY_PALETTE[i % CATEGORY_PALETTE.length];
        ctx.beginPath(); ctx.arc(x+4, y, 4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#2A2A28';
        const label = lab+' — '+fmt(val)+' ('+pct+'%)';
        ctx.fillText(ellipsize(ctx, label, colW-24), x+11, y);
        col++;
        if(col>=cols){ col=0; y+=17; }
      });
    });
  }

  // Buckets a text field into its top-N most frequent values; everything else becomes "Other".
  function categorize(list, key, topN){
    const counts = {};
    list.forEach(r=>{ const v=(r[key]||'').toString().trim(); if(v) counts[v]=(counts[v]||0)+1; });
    const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    const top = sorted.slice(0, topN).map(e=>e[0]);
    return { of:(v)=>{ v=(v||'').toString().trim(); return (v && top.includes(v)) ? top.indexOf(v) : top.length; },
             labels:[...top, 'ផ្សេងៗ / Other'] };
  }

  // Counts occurrences of a field's values. Returns {label: count}, blanks excluded.
  function countBy(list, key){
    const out = {};
    list.forEach(r=>{ const v=(r[key]||'').toString().trim(); if(v) out[v]=(out[v]||0)+1; });
    return out;
  }
  // Sums a numeric field grouped by a text field. Returns {label: sum}.
  function sumBy(list, groupKey, valueKey){
    const out = {};
    list.forEach(r=>{ const v=(r[groupKey]||'').toString().trim(); if(!v) return; out[v]=(out[v]||0)+numVal(r[valueKey]); });
    return out;
  }
  // Collapses a {label:value} map to its top-N entries (by value) plus one "Other" bucket.
  function topNBucket(obj, n){
    const entries = Object.entries(obj).sort((a,b)=>b[1]-a[1]);
    const top = entries.slice(0, n);
    const rest = entries.slice(n);
    const restSum = rest.reduce((s,e)=>s+e[1], 0);
    const labels = top.map(e=>e[0]); const values = top.map(e=>e[1]);
    if(restSum > 0){ labels.push('ផ្សេងៗ / Other'); values.push(restSum); }
    return { labels, values };
  }

  function renderTabs(){
    tabsEl.innerHTML = '';
    document.querySelectorAll('.pgs-tab-dd-menu').forEach(m=> m.remove());
    const tabs = [];
    let deptTabs = [];
    if(state.role==='governor'){
      tabs.push({key:'dashboard', label:'ផ្ទាំងបង្ហាញសរុប'});
      tabs.push({key:'compare', label:'ប្រៀបធៀបទិន្នន័យ'});
      tabs.push({key:'map', label:'ផែនទី'});
      tabs.push({key:'insights', label:'និន្នាការ'});
      deptTabs = DEPT_KEYS.map(k=> ({key:k, label:DEPARTMENTS[k].short, count:state.records[k].length}));
    } else {
      tabs.push({key:'dashboard', label:'Dashboard'});
      tabs.push({key:'compare', label:'ប្រៀបធៀបទិន្នន័យ'});
      // Single-department roles keep just one item; no need for a dropdown.
      tabs.push({key:state.role, label:DEPARTMENTS[state.role].short+' Records', count:state.records[state.role].length});
    }
    tabs.forEach(t=>{
      const btn = document.createElement('button');
      btn.className = 'pgs-tab' + (state.view===t.key?' active':'');
      btn.innerHTML = t.label + (t.count!=null ? ' <span class="count">'+t.count+'</span>' : '');
      btn.onclick = ()=>{ state.view = t.key; state.editIndex=null; renderChrome(); };
      tabsEl.appendChild(btn);
    });

    if(deptTabs.length){
      const activeDept = deptTabs.find(t=> t.key===state.view);
      const wrap = document.createElement('div');
      wrap.className = 'pgs-tab-dropdown';

      const ddBtn = document.createElement('button');
      ddBtn.className = 'pgs-tab-dd-btn' + (activeDept ? ' active' : '');
      ddBtn.innerHTML = 'មន្ទី'
        + (activeDept ? ' <span class="count">'+activeDept.count+'</span>' : '')
        + ' <span class="pgs-tab-dd-caret">\u25BC</span>';

      const menu = document.createElement('div');
      menu.className = 'pgs-tab-dd-menu';
      menu.style.display = 'none';
      deptTabs.forEach(t=>{
        const item = document.createElement('button');
        item.className = 'pgs-tab-dd-item' + (state.view===t.key?' active':'');
        item.innerHTML = '<span>'+t.label+'</span><span class="count">'+t.count+'</span>';
        item.onclick = (e)=>{ e.stopPropagation(); state.view = t.key; state.editIndex=null; renderChrome(); };
        menu.appendChild(item);
      });

      // Attach menu to <body> with fixed positioning so it always drops down
      // below the button, unclipped by the scrollable tab bar (overflow-x:auto).
      document.body.appendChild(menu);
      const closeMenu = ()=>{ menu.style.display='none'; ddBtn.classList.remove('open'); };
      const positionMenu = ()=>{
        const r = ddBtn.getBoundingClientRect();
        menu.style.position = 'fixed';
        menu.style.top = r.bottom + 4 + 'px';
        menu.style.left = r.left + 'px';
      };
      ddBtn.onclick = (e)=>{
        e.stopPropagation();
        const isOpen = menu.style.display === 'block';
        document.querySelectorAll('.pgs-tab-dd-menu').forEach(m=> m.style.display='none');
        document.querySelectorAll('.pgs-tab-dd-btn').forEach(b=> b.classList.remove('open'));
        if(!isOpen){ positionMenu(); menu.style.display = 'block'; ddBtn.classList.add('open'); }
      };
      window.addEventListener('scroll', ()=>{ if(menu.style.display==='block') positionMenu(); }, true);
      window.addEventListener('resize', ()=>{ if(menu.style.display==='block') positionMenu(); });

      wrap.appendChild(ddBtn);
      tabsEl.appendChild(wrap);

      document.addEventListener('click', closeMenu);
    }
  }

  function renderView(){
    if(state.view==='dashboard'){

    if(state.view==='insights') return renderInsightsView();
    if(state.view==='compare') return renderCompareView();

      const invTypeCv = panel('ប្រភេទវិនិយោគ', 'pgsCdcInvTypeCount');
      drawPie('cdcInvTypeCount', invTypeCv, Object.keys(invTypeCounts), Object.values(invTypeCounts));

      // Pie: invested capital by investment type
      const invType = sumBy(list, 'Investment Type', 'Invested Capital');
      const pieCv = panel('ដើមទុនវិនិយោគតាមប្រភេទវិនិយោគ', 'pgsCdcInvType');
      drawPie('cdcInvType', pieCv, Object.keys(invType), Object.values(invType));

    } else if(deptKey==='labor'){
      // Bar: total workers by district
      const distWorkers = sumBy(list, 'District', 'Total Workers');
      const distSorted = Object.entries(distWorkers).sort((a,b)=>b[1]-a[1]);
      const barCv = panel('កម្មករសរុបតាមស្រុក', 'pgsLaborDistrict');
      drawBar('laborDistrict', barCv, distSorted.map(e=>e[0]), distSorted.map(e=>e[1]), 'Workers', d.colorHex);

      // Pie: gender composition
      const female = list.reduce((s,r)=>s+numVal(r['Women Workers']),0);
      const total = list.reduce((s,r)=>s+numVal(r['Total Workers']),0);
      const pieCv = panel('កម្លាំងពលកម្មតាមភេទ', 'pgsLaborGender');
      drawPie('laborGender', pieCv, ['Female Workers','Male Workers'], [female, Math.max(total-female,0)]);

      // Bar: owner nationality
      const ownerNat = countBy(list, 'Owner Nationality');
      const ownerCv = panel('សញ្ជាតិម្ចាស់', 'pgsLaborOwnerNat');
      drawBar('laborOwnerNat', ownerCv, Object.keys(ownerNat), Object.values(ownerNat), 'Companies', d.colorHex, true);

      // Bar: business type
      const bizBucket = topNBucket(countBy(list, 'Business Type'), 7);
      const bizCv = panel('ប្រភេទអាជីវកម្ម', 'pgsLaborBizType');
      drawBar('laborBizType', bizCv, bizBucket.labels, bizBucket.values, 'Companies', d.colorHex, true);

    } else if(deptKey==='misti'){
      // Stacked bar: district x product-type category
      const cat = categorize(list, 'Product Type', 5);
      const districts = [...new Set(list.map(r=>(r['District']||'').toString().trim()).filter(Boolean))]
        .sort((a,b)=> list.filter(r=>r['District']===b).length - list.filter(r=>r['District']===a).length);
      const catDatasets = cat.labels.map((label, ci)=>({
        label, backgroundColor: CATEGORY_PALETTE[ci % CATEGORY_PALETTE.length],
        data: districts.map(dist => list.filter(r => (r['District']||'').toString().trim()===dist && cat.of(r['Product Type'])===ci).length)
      }));
      const stackCv = panel('ស្រុកដែលមានរោងចក្រ តាមប្រភេទផលិតផល', 'pgsMistiDistProduct', true);
      drawStackedBar(stackCv, districts, catDatasets);

      // Bar: capital invested by district
      const distCapital = sumBy(list, 'District', 'Capital (USD)');
      const distCapSorted = Object.entries(distCapital).sort((a,b)=>b[1]-a[1]);
      const capCv = panel('ដើមទុនវិនិយោគតាមស្រុក (ដុល្លារ)', 'pgsMistiCapital');
      drawBar('mistiCapital', capCv, distCapSorted.map(e=>e[0]), distCapSorted.map(e=>e[1]), 'Capital (USD)', d.colorHex);

      // Pie: foreign investment by country
      const foreignInv = countBy(list, 'Foreign Investment');
      const fiCv = panel('វិនិយោគបរទេសតាមប្រទេស', 'pgsMistiForeignInv');
      drawPie('mistiForeignInv', fiCv, Object.keys(foreignInv), Object.values(foreignInv));

      // Pie: imported material by country
      const impMat = countBy(list, 'Imported Material');
      const imCv = panel('សម្ភារៈនាំចូលតាមប្រទេស', 'pgsMistiImportedMat');
      drawPie('mistiImportedMat', imCv, Object.keys(impMat), Object.values(impMat));
    }

    const hint = document.createElement('div'); hint.className='hint';
    hint.textContent = 'Go to "'+d.short+' Records" to add, edit, or bulk-upload data.';
    bodyEl.appendChild(hint);
  }

  // ---------- INSIGHTS & PROJECTIONS (multi-year trends + simple linear forecasts) ----------
  function renderInsightsView(){
    const cdc = state.records.cdc||[], labor = state.records.labor||[], misti = state.records.misti||[];
    bodyEl.innerHTML = '';

    const CURRENT_YEAR = new Date().getFullYear(); // 2026 — this year's data is partial (through today), not a full year

    // ---- Build per-year aggregates for each department ----
    const cdcByYr = groupByYear(cdc, 'Registration Date', { capital:'Invested Capital', local:'Local Workers', foreign:'Foreign Workers' });
    const laborByYr = groupByYear(labor, 'date_start', { workers:'Total Workers', women:'Women Workers' });
    const mistiByYr = groupByYear(misti, 'Certificate Date', { capital:'Capital (USD)', workers:'Total Workers', female:'Female Workers', exportValue:'Total Price (USD)' });

    // Only fit trend lines on *complete* years — the current year is still in progress (and a
    // few source records carry forward-dated entries) which would distort a naive fit.
    const allYears = [...new Set([...Object.keys(cdcByYr), ...Object.keys(laborByYr), ...Object.keys(mistiByYr)].map(Number))].sort((a,b)=>a-b);
    const completeYears = allYears.filter(y=>y<CURRENT_YEAR);
    const maxYear = allYears.length ? allYears[allYears.length-1] : CURRENT_YEAR;
    // One extra year appended purely for the forecast point — never a duplicate of real data.
    const chartYears = [...allYears, maxYear+1];
    // Everything from the current (partial) year onward is styled as "projected", including any
    // stray forward-dated actuals beyond it — the appended final year is always a pure forecast.
    let projFromIdx = chartYears.findIndex(y=>y>=CURRENT_YEAR);
    if(projFromIdx===-1) projFromIdx = chartYears.length-1;

    function seriesFor(byYr, key, label, color){
      const reg = linearRegression(completeYears.map(y=>[y, (byYr[y]&&byYr[y][key])||0]));
      const data = chartYears.map(y=>{
        if(y===maxYear+1) return Math.max(0, Math.round(reg.predict(y))); // appended forecast-only point
        return (byYr[y] && byYr[y][key]!=null) ? byYr[y][key] : null;
      });
      return { label, color, data, projectedFrom: projFromIdx, reg };
    }

    function sectionLabel(text, sub){
      const h = document.createElement('div'); h.style.cssText='font-weight:700; font-size:13px; color:var(--navy-dark); margin:18px 0 10px;';
      h.textContent = text; bodyEl.appendChild(h);
      if(sub){ const s=document.createElement('div'); s.className='hint'; s.style.margin='-6px 0 12px'; s.textContent=sub; bodyEl.appendChild(s); }
    }
    function panel(title, canvasId, span){
      const p = document.createElement('div'); p.className='pgs-panel'; if(span) p.style.gridColumn='1/-1';
      p.innerHTML = '<h3>'+title+'</h3><div class="chart-wrap" style="height:290px"><canvas id="'+canvasId+'"></canvas></div>';
      return p;
    }

    const introNote = document.createElement('div'); introNote.className='hint'; introNote.style.margin='0 0 4px';
    introNote.textContent = 'ទិន្នន័យឆ្នាំ '+CURRENT_YEAR+' នៅមិនទាន់ពេញលេញនៅឡើយ (ឆ្នាំកំពុងដំណើរការ)។ បន្ទាត់និន្នាការត្រូវបានគណនាផ្អែកលើឆ្នាំពេញលេញតែប៉ុណ្ណោះ ('+completeYears[0]+'\u2013'+completeYears[completeYears.length-1]+'); ចំណុចជាបន្ទាត់ចំណុចគឺជាការព្យាករណ៍ មិនមែនទិន្នន័យដែលបានរាយការណ៍ទេ។';
    bodyEl.appendChild(introNote);

    // ---- KPI / projection cards ----
    const cdcCapReg = linearRegression(completeYears.map(y=>[y,(cdcByYr[y]&&cdcByYr[y].capital)||0]));
    const laborWorkReg = linearRegression(completeYears.map(y=>[y,(laborByYr[y]&&laborByYr[y].workers)||0]));
    const mistiCapReg = linearRegression(completeYears.map(y=>[y,(mistiByYr[y]&&mistiByYr[y].capital)||0]));
    const cdcCountReg = linearRegression(completeYears.map(y=>[y,(cdcByYr[y]&&cdcByYr[y].count)||0]));

    const nextYear = maxYear+1;
    const cardsWrap = document.createElement('div'); cardsWrap.className='pgs-cards';
    const cards = [
      {k:'ការវិនិយោគ CDC ព្យាករណ៍ ឆ្នាំ '+nextYear, v:'$'+fmt(Math.max(0,cdcCapReg.predict(nextYear))), d:'និន្នាការលីនេអ៊ែរពី '+completeYears[0]+'\u2013'+completeYears[completeYears.length-1]},
      {k:'ការចុះបញ្ជីថ្មីព្យាករណ៍ ឆ្នាំ '+nextYear, v:fmt(Math.max(0,cdcCountReg.predict(nextYear))), d:'អាជីវកម្ម CDC ការប៉ាន់ស្មានផ្អែកលើនិន្នាការ'},
      {k:'កម្លាំងពលកម្មបន្ថែមព្យាករណ៍ (ការងារ) ឆ្នាំ '+nextYear, v:fmt(Math.max(0,laborWorkReg.predict(nextYear))), d:'កម្មករនៅរោងចក្រដែលបើកនៅឆ្នាំនោះ'},
      {k:'ដើមទុន MISTI ព្យាករណ៍ ឆ្នាំ '+nextYear, v:'$'+fmt(Math.max(0,mistiCapReg.predict(nextYear))), d:'អ្នកផលិតឧស្សាហកម្មដែលមានវិញ្ញាបនបត្រ'}
    ];
    cards.forEach(c=>{
      const div = document.createElement('div'); div.className='pgs-card';
      div.innerHTML = '<div class="k">'+c.k+'</div><div class="v">'+c.v+'</div><div class="d">'+c.d+'</div>';
      cardsWrap.appendChild(div);
    });
    bodyEl.appendChild(cardsWrap);

    // ---- Trend + projection line charts ----
    sectionLabel('និន្នាការវិនិយោគ និងការព្យាករណ៍', 'ដើមទុនវិនិយោគ/ដែលមានវិញ្ញាបនបត្រតាមឆ្នាំ (ដុល្លារ) ជាមួយការព្យាករណ៍មួយឆ្នាំខាងមុខបង្ហាញជាបន្ទាត់ចំណុច។');
    const grid1 = document.createElement('div'); grid1.style.cssText='display:grid; grid-template-columns:1fr 1fr; gap:16px;'; bodyEl.appendChild(grid1);
    const p1 = panel('CDC — ដើមទុនវិនិយោគតាមឆ្នាំ', 'pgsInsCdcCap'); grid1.appendChild(p1);
    const p2 = panel('MISTI — ដើមទុនដែលមានវិញ្ញាបនបត្រតាមឆ្នាំ', 'pgsInsMistiCap'); grid1.appendChild(p2);

    sectionLabel('និន្នាការចុះបញ្ជី និងការងារ', 'ការចុះបញ្ជីថ្មី វិញ្ញាបនបត្រ និងកម្លាំងពលកម្មបន្ថែមតាមឆ្នាំ ជាមួយការព្យាករណ៍។');
    const grid2 = document.createElement('div'); grid2.style.cssText='display:grid; grid-template-columns:1fr 1fr; gap:16px;'; bodyEl.appendChild(grid2);
    const p3 = panel('អាជីវកម្មថ្មីដែលបានចុះបញ្ជីក្នុងមួយឆ្នាំ (គ្រប់នាយកដ្ឋាន)', 'pgsInsCounts'); grid2.appendChild(p3);
    const p4 = panel('កម្លាំងពលកម្មបន្ថែមក្នុងមួយឆ្នាំ (ការងារ — តាមឆ្នាំចាប់ផ្ដើមរោងចក្រ)', 'pgsInsWorkers'); grid2.appendChild(p4);

    sectionLabel('តម្លៃនាំចេញ និងសមាសភាពកម្លាំងពលកម្ម', 'តម្លៃលក់នាំចេញ MISTI និងសមាមាត្រកម្មករស្ត្រីតាមពេលវេលា។');
    const grid3 = document.createElement('div'); grid3.style.cssText='display:grid; grid-template-columns:1fr 1fr; gap:16px;'; bodyEl.appendChild(grid3);
    const p5 = panel('MISTI — តម្លៃលក់នាំចេញសរុបតាមឆ្នាំ (ដុល្លារ)', 'pgsInsExport'); grid3.appendChild(p5);
    const p6 = panel('សមាមាត្រកម្មករស្ត្រីតាមឆ្នាំ', 'pgsInsGender'); grid3.appendChild(p6);

    const labels = chartYears.map(String);

    drawLine(document.getElementById('pgsInsCdcCap'), labels,
      [seriesFor(cdcByYr,'capital','ដើមទុនវិនិយោគ ($)', DEPARTMENTS.cdc.colorHex)], '$');
    drawLine(document.getElementById('pgsInsMistiCap'), labels,
      [seriesFor(mistiByYr,'capital','ដើមទុន ($)', DEPARTMENTS.misti.colorHex)], '$');

    drawLine(document.getElementById('pgsInsCounts'), labels, [
      seriesFor(cdcByYr,'count','ការចុះបញ្ជី CDC', DEPARTMENTS.cdc.colorHex),
      seriesFor(laborByYr,'count','ការបើករោងចក្រ (ការងារ)', DEPARTMENTS.labor.colorHex),
      seriesFor(mistiByYr,'count','វិញ្ញាបនបត្រ MISTI', DEPARTMENTS.misti.colorHex)
    ]);
    drawLine(document.getElementById('pgsInsWorkers'), labels,
      [seriesFor(laborByYr,'workers','កម្មករនៅរោងចក្រដែលទើបបើកថ្មី', DEPARTMENTS.labor.colorHex)]);

    drawLine(document.getElementById('pgsInsExport'), labels,
      [seriesFor(mistiByYr,'exportValue','តម្លៃលក់នាំចេញ ($)', DEPARTMENTS.misti.colorHex)], '$');

    // Female workforce share isn't summable the same way — compute ratio per year directly (no regression/projection, just observed trend).
    const genderYears = allYears.filter(y=> (laborByYr[y]||mistiByYr[y]));
    const femaleShareData = genderYears.map(y=>{
      const w = ((laborByYr[y]&&laborByYr[y].workers)||0) + ((mistiByYr[y]&&mistiByYr[y].workers)||0);
      const f = ((laborByYr[y]&&laborByYr[y].women)||0) + ((mistiByYr[y]&&mistiByYr[y].female)||0);
      return w>0 ? Math.round((f/w)*1000)/10 : null;
    });
    drawLine(document.getElementById('pgsInsGender'), genderYears.map(String),
      [{ label:'សមាមាត្រកម្មករស្ត្រី (%)', color:DEPARTMENTS.labor.colorHex, data: femaleShareData }], '');

    // ---- Auto-generated insight notes ----
    sectionLabel('ការយល់ដឹងសំខាន់ៗ');
    const notesWrap = document.createElement('div'); notesWrap.className='pgs-panel';
    const notes = [];

    const capGrowth = cdcCapReg.slope;
    notes.push((capGrowth>=0?'ដើមទុនវិនិយោគ CDC មានទំនោរកើនឡើង':'ដើមទុនវិនិយោគ CDC មានទំនោរធ្លាក់ចុះ')+
      ' ជាមធ្យម '+(capGrowth>=0?'+':'-')+'$'+fmt(Math.abs(capGrowth))+' ក្នុងមួយឆ្នាំ ក្នុងអំឡុងឆ្នាំ '+completeYears[0]+'\u2013'+completeYears[completeYears.length-1]+
      '។ តាមអត្រានេះ ការវិនិយោគឆ្នាំ '+nextYear+' ត្រូវបានព្យាករណ៍ថានឹងមានប្រមាណ $'+fmt(Math.max(0,cdcCapReg.predict(nextYear)))+'។');

    const totalWorkersLabor = labor.reduce((s,r)=>s+numVal(r['Total Workers']),0);
    const totalFemaleLabor = labor.reduce((s,r)=>s+numVal(r['Women Workers']),0);
    const femalePct = totalWorkersLabor>0 ? Math.round((totalFemaleLabor/totalWorkersLabor)*1000)/10 : 0;
    notes.push('ស្ត្រីមានចំនួន '+femalePct+'% នៃកម្លាំងពលកម្មដែលបានចុះបញ្ជីជាមួយនាយកដ្ឋានការងារ ('+fmt(totalFemaleLabor)+' ក្នុងចំណោម '+fmt(totalWorkersLabor)+' កម្មករ) '+
      'ស្របជាមួយមូលដ្ឋានឧស្សាហកម្មសំលៀកបំពាក់នៃតំបន់នេះ។');

    const natCounts = countBy(cdc, 'Nationality Investment');
    const natSorted = Object.entries(natCounts).sort((a,b)=>b[1]-a[1]);
    if(natSorted.length){
      const topNat = natSorted[0];
      const pct = Math.round((topNat[1]/cdc.length)*1000)/10;
      notes.push('ការវិនិយោគមានការប្រមូលផ្តុំតាមប្រភពដើម៖ '+topNat[0]+' មានចំណែក '+pct+'% នៃអាជីវកម្មដែលបានចុះបញ្ជីជាមួយ CDC ('+topNat[1]+' ក្នុងចំណោម '+cdc.length+'), '+
        (pct>50?'ដែលបង្ហាញពីការពឹងផ្អែកយ៉ាងសំខាន់ទៅលើសញ្ជាតិវិនិយោគិនតែមួយ។':'ជាប្រភពធំបំផុតតែមួយ ប៉ុន្តែមិនមែនភាគច្រើនផ្តាច់មុខទេ។'));
    }

    const avgFactorySize = labor.length ? Math.round(totalWorkersLabor/labor.length) : 0;
    notes.push('រោងចក្រដែលបានចុះបញ្ជីជាមួយនាយកដ្ឋានការងារ ជាមធ្យមមានកម្មករប្រមាណ '+fmt(avgFactorySize)+' នាក់; '+
      'អ្នកផលិតដែលមានវិញ្ញាបនបត្រ MISTI រាយការណ៍ថាមានដើមទុនជាមធ្យម $'+fmt(misti.length? misti.reduce((s,r)=>s+numVal(r['Capital (USD)']),0)/misti.length : 0)+' ក្នុងមួយអ្នកផលិត។');

    const exportPct = misti.length ? Math.round((misti.filter(r=>(r['Export Market']||'').trim()!=='').length/misti.length)*1000)/10 : 0;
    notes.push(exportPct+'% នៃអ្នកផលិតដែលមានវិញ្ញាបនបត្រ MISTI រាយការណ៍ថាមានទីផ្សារនាំចេញ ដែលបញ្ជាក់ពីទិសដៅរបស់ស្រុកទៅរកឧស្សាហកម្មផលិតសម្រាប់នាំចេញ។');

    if(cdcCountReg.slope < 0){
      notes.push('ចំណាំ៖ ចំនួនការចុះបញ្ជីថ្មីរបស់ CDC បង្ហាញនិន្នាការធ្លាក់ចុះក្នុងអំឡុងឆ្នាំដែលបានគណនា — គួរជម្រាបជូនការិយាល័យអភិបាល ជាសញ្ញាអាចមានការថយចុះ ទោះបីជាចំនួនឆ្នាំ '+CURRENT_YEAR+' នៅមិនទាន់ពេញលេញក៏ដោយ។');
    }

    const ul = document.createElement('ul'); ul.style.cssText='margin:4px 0 0; padding-left:20px; font-size:13px; line-height:1.75; color:var(--ink);';
    notes.forEach(n=>{ const li=document.createElement('li'); li.textContent=n; ul.appendChild(li); });
    notesWrap.appendChild(ul);
    bodyEl.appendChild(notesWrap);

    const caveat = document.createElement('div'); caveat.className='hint';
    caveat.textContent = 'ការព្យាករណ៍ប្រើវិធីតំរែកលីនេអ៊ែរធម្មតាលើទិន្នន័យសរុបប្រចាំឆ្នាំកន្លងមក ហើយគ្រាន់តែជាការចង្អុលបង្ហាញប៉ុណ្ណោះ — វាមិនបានគិតគូរពីការផ្លាស់ប្តូរគោលនយោបាយ រដូវកាល ឬការវិនិយោគធំមួយពេលនោះទេ។';

  // ---------- COMPARE (side-by-side Period A vs Period B, across departments) ----------
  // Unlike filteredRecords (which keeps undated rows so the general filter never silently
  // hides messy data), a period comparison must NOT count an undated row in both periods —
  // so rows with no parseable date are simply excluded from either bucket.
  function periodRecords(deptKey, fromStr, toStr){
    const list = state.records[deptKey] || [];
    const dateKey = DATE_FIELDS[deptKey];
    if(!dateKey || (!fromStr && !toStr)) return list;
    const from = fromStr ? new Date(fromStr+'T00:00:00') : null;
    const to = toStr ? new Date(toStr+'T23:59:59') : null;
    return list.filter(r=>{
      const dt = parseFlexibleDate(r[dateKey]);
      if(!dt) return false;
      if(from && dt < from) return false;
      if(to && dt > to) return false;
      return true;
    });
  }

  function sumField(list, key){ return list.reduce((s,r)=>s+numVal(r[key]),0); }

  // Each department's headline comparison metrics: [key, label, isMoney]
  const COMPARE_METRICS = {
    cdc: [
      ['count', 'ចំនួនអាជីវកម្មដែលបានចុះបញ្ជី', false],
      ['investedCapital', 'ដើមទុនវិនិយោគសរុប', true],
      ['localWorkers', 'កម្មករក្នុងស្រុកសរុប', false],
      ['foreignWorkers', 'កម្មករបរទេសសរុប', false]
    ],
    labor: [
      ['count', 'ចំនួនរោងចក្រដែលបានចុះបញ្ជី', false],
      ['totalWorkers', 'កម្មករសរុប', false],
      ['womenWorkers', 'កម្មករស្ត្រី', false],
      ['foreignWorkers', 'កម្មករបរទេស', false]
    ],
    misti: [
      ['count', 'ចំនួនវិញ្ញាបនបត្រថ្មី', false],
      ['capital', 'ដើមទុនដែលមានវិញ្ញាបនបត្រ', true],
      ['totalWorkers', 'កម្មករសរុប', false],
      ['exportValue', 'តម្លៃលក់នាំចេញសរុប', true]
    ]
  };

  function computeCompareMetrics(deptKey, records){
    if(deptKey==='cdc') return {
      count: records.length,
      investedCapital: sumField(records,'Invested Capital'),
      localWorkers: sumField(records,'Local Workers'),
      foreignWorkers: sumField(records,'Foreign Workers')
    };
    if(deptKey==='labor') return {
      count: records.length,
      totalWorkers: sumField(records,'Total Workers'),
      womenWorkers: sumField(records,'Women Workers'),
      foreignWorkers: sumField(records,'Foreign Workers')
    };
    return {
      count: records.length,
      capital: sumField(records,'Capital (USD)'),
      totalWorkers: sumField(records,'Total Workers'),
      exportValue: sumField(records,'Total Price (USD)')
    };
  }

  // Two-series grouped bar chart used to compare Period A vs Period B side by side.
  function drawGroupedBar(canvas, labels, dataA, dataB, labelA, labelB, colorA, colorB){
    observeAndRender(canvas, function(){
      const { ctx, w, h } = fitCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      if(!labels.length){ emptyState(ctx,w,h); return; }
      const pad = 8, bottomH = 44, topH = 22;
      const barAreaH = Math.max(20, h-bottomH-topH);
      const max = Math.max(1, ...dataA.map(v=>v||0), ...dataB.map(v=>v||0));
      const slotW = (w-pad*2)/labels.length;
      const groupW = Math.min(slotW-10, 70);
      const barW = Math.max(5, groupW/2-3);
      ctx.font = '10px ' + PGS_FONT_STACK;
      labels.forEach((lab,i)=>{
        const slotX = pad+i*slotW;
        const groupX = slotX+(slotW-groupW)/2;
        const valA = dataA[i]||0, valB = dataB[i]||0;
        const barHA = Math.max(valA>0?2:0, (valA/max)*barAreaH);
        const barHB = Math.max(valB>0?2:0, (valB/max)*barAreaH);
        ctx.fillStyle = colorA;
        roundRect(ctx, groupX, topH+barAreaH-barHA, barW, barHA, 3); ctx.fill();
        ctx.fillStyle = colorB;
        roundRect(ctx, groupX+barW+3, topH+barAreaH-barHB, barW, barHB, 3); ctx.fill();
        // The two value labels sit close together above narrow paired bars, so a
        // wide number can spill into its neighbor. If the labels are wide enough
        // to collide, lift the second one onto its own tier so they never overlap.
        const textA = fmt(valA), textB = fmt(valB);
        const centerA = groupX+barW/2, centerB = groupX+barW+3+barW/2;
        const widthA = ctx.measureText(textA).width, widthB = ctx.measureText(textB).width;
        const collide = (widthA/2+widthB/2) > (centerB-centerA)-4;
        ctx.fillStyle = '#6B655A'; ctx.textAlign = 'center';
        ctx.fillText(textA, centerA, Math.max(9, topH+barAreaH-barHA-6));
        ctx.fillText(textB, centerB, Math.max(9, topH+barAreaH-barHB-6-(collide?12:0)));
        ctx.fillStyle = '#2A2A28'; ctx.font = '10.5px ' + PGS_FONT_STACK;
        ctx.fillText(ellipsize(ctx, lab, slotW-4), slotX+slotW/2, topH+barAreaH+16);
        ctx.font = '10px ' + PGS_FONT_STACK;
      });
      // legend
      ctx.textAlign = 'left'; ctx.font = '11px ' + PGS_FONT_STACK;
      ctx.fillStyle = colorA; ctx.fillRect(pad, 4, 10, 10);
      ctx.fillStyle = '#2A2A28'; ctx.fillText(labelA, pad+14, 13);
      const labelAWidth = ctx.measureText(labelA).width;
      ctx.fillStyle = colorB; ctx.fillRect(pad+14+labelAWidth+16, 4, 10, 10);
      ctx.fillStyle = '#2A2A28'; ctx.fillText(labelB, pad+14+labelAWidth+30, 13);
    });
  }

  function renderCompareView(){
    // Default to a full-year comparison ("this year" vs "last year") the first time this
    // tab is opened, so the view is never blank before the user picks custom dates.
    if(!state.cmpAFrom && !state.cmpATo && !state.cmpBFrom && !state.cmpBTo){
      const y = new Date().getFullYear();
      state.cmpAFrom = y+'-01-01'; state.cmpATo = y+'-12-31';
      state.cmpBFrom = (y-1)+'-01-01'; state.cmpBTo = (y-1)+'-12-31';
    }

    bodyEl.innerHTML = '';
    const deptKeys = state.role==='governor' ? DEPT_KEYS : [state.role];
    const dateInputStyle = 'padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:inherit;background:#fff;';

    // ---- Period picker ----
    const pickerWrap = document.createElement('div'); pickerWrap.className='pgs-panel'; pickerWrap.style.marginBottom='16px';
    pickerWrap.innerHTML =
      '<div style="display:flex; gap:24px; flex-wrap:wrap;">'+
        '<div>'+
          '<div style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:'+DEPARTMENTS.cdc.colorHex+';margin-bottom:6px;">រយៈពេល A</div>'+
          '<div style="display:flex;align-items:center;gap:8px;">'+
            '<input type="date" id="pgsCmpAFrom" value="'+state.cmpAFrom+'" style="'+dateInputStyle+'">'+
            '<span style="color:#8A8474;font-size:12px;">ដល់</span>'+
            '<input type="date" id="pgsCmpATo" value="'+state.cmpATo+'" style="'+dateInputStyle+'">'+
          '</div>'+
        '</div>'+
        '<div>'+
          '<div style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:'+DEPARTMENTS.misti.colorHex+';margin-bottom:6px;">រយៈពេល B</div>'+
          '<div style="display:flex;align-items:center;gap:8px;">'+
            '<input type="date" id="pgsCmpBFrom" value="'+state.cmpBFrom+'" style="'+dateInputStyle+'">'+
            '<span style="color:#8A8474;font-size:12px;">ដល់</span>'+
            '<input type="date" id="pgsCmpBTo" value="'+state.cmpBTo+'" style="'+dateInputStyle+'">'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="hint" style="margin-top:10px;">លំនាំដើម៖ ឆ្នាំពេញនេះ (A) ធៀបនឹងឆ្នាំពេញមុន (B) — កែប្រែកាលបរិច្ឆេទខាងលើបានតាមចង់។ ការប្រៀបធៀបផ្អែកលើ៖ CDC (កាលបរិច្ឆេទចុះបញ្ជី), MISTI (កាលបរិច្ឆេទវិញ្ញាបនបត្រ), ការងារ (កាលបរិច្ឆេទចាប់ផ្ដើម)។ កំណត់ត្រាដែលគ្មានកាលបរិច្ឆេទច្បាស់លាស់ មិនត្រូវបានរាប់បញ្ចូលក្នុងរយៈពេលណាមួយឡើយ។</div>';
    bodyEl.appendChild(pickerWrap);

    function onDateChange(field){
      return e=>{ state[field] = e.target.value; renderCompareView(); };
    }
    document.getElementById('pgsCmpAFrom').addEventListener('change', onDateChange('cmpAFrom'));
    document.getElementById('pgsCmpATo').addEventListener('change', onDateChange('cmpATo'));
    document.getElementById('pgsCmpBFrom').addEventListener('change', onDateChange('cmpBFrom'));
    document.getElementById('pgsCmpBTo').addEventListener('change', onDateChange('cmpBTo'));

    // ---- Per-department metric cards + chart ----
    deptKeys.forEach(deptKey=>{
      const d = DEPARTMENTS[deptKey];
      const recsA = periodRecords(deptKey, state.cmpAFrom, state.cmpATo);
      const recsB = periodRecords(deptKey, state.cmpBFrom, state.cmpBTo);
      const mA = computeCompareMetrics(deptKey, recsA);
      const mB = computeCompareMetrics(deptKey, recsB);
      const metrics = COMPARE_METRICS[deptKey];

      const sectionHead = document.createElement('div');
      sectionHead.style.cssText = 'font-weight:700; font-size:13.5px; color:'+d.colorHex+'; margin:6px 0 10px; display:flex; align-items:center; gap:8px;';
      sectionHead.innerHTML = '<span class="pgs-legend-dot" style="background:'+d.colorHex+';width:11px;height:11px;"></span>'+d.short;
      bodyEl.appendChild(sectionHead);

      const cardsWrap = document.createElement('div'); cardsWrap.className='pgs-cards'; cardsWrap.style.marginBottom='12px';
      metrics.forEach(([key,label,isMoney])=>{
        const vA = mA[key]||0, vB = mB[key]||0;
        const diff = vA - vB;
        const pct = vB!==0 ? (diff/Math.abs(vB))*100 : (vA!==0 ? 100 : 0);
        const up = diff>0, flat = diff===0;
        const arrow = flat ? '—' : (up ? '▲' : '▼');
        const changeColor = flat ? '#8A8474' : (up ? 'var(--green)' : 'var(--maroon)');
        const fmtVal = v => isMoney ? '$'+fmt(v) : fmt(v);
        const div = document.createElement('div'); div.className='pgs-card';
        div.innerHTML =
          '<div class="k">'+label+'</div>'+
          '<div class="v" style="font-size:19px;">'+fmtVal(vA)+'</div>'+
          '<div class="d" style="margin-top:6px;">B: '+fmtVal(vB)+'</div>'+
          '<div style="margin-top:6px; font-size:12px; font-weight:700; color:'+changeColor+';">'+arrow+' '+(flat?'':(up?'+':''))+ (isMoney?'$'+fmt(Math.abs(diff)):fmt(Math.abs(diff))) +' ('+(flat?'0':(up?'+':'-'))+Math.abs(Math.round(pct))+'%)</div>';
        cardsWrap.appendChild(div);
      });
      bodyEl.appendChild(cardsWrap);

      const chartPanel = document.createElement('div'); chartPanel.className='pgs-panel'; chartPanel.style.marginBottom='20px';
      const canvasId = 'pgsCmp_'+deptKey;
      chartPanel.innerHTML = '<h3>'+d.short+' — A ធៀបនឹង B</h3><div class="chart-wrap" style="height:260px"><canvas id="'+canvasId+'"></canvas></div>';
      bodyEl.appendChild(chartPanel);

      const chartLabels = metrics.map(m=>m[1]);
      const chartA = metrics.map(m=>mA[m[0]]||0);
      const chartB = metrics.map(m=>mB[m[0]]||0);
      drawGroupedBar(document.getElementById(canvasId), chartLabels, chartA, chartB, 'រយៈពេល A', 'រយៈពេល B', DEPARTMENTS.cdc.colorHex, DEPARTMENTS.misti.colorHex);
    });
  }

  const PROFILE_EYEBROW = {
    cdc: 'CDC — BUSINESS REGISTRATION · OFFICIAL PROFILE',
    labor: 'LABOR — FACTORY REGISTRATION · OFFICIAL PROFILE',
    misti: 'MISTI — INDUSTRY CERTIFICATE · OFFICIAL PROFILE'
  };
  // Fields shown as big "at a glance" numbers in the profile sidebar — capital and
  // headcount figures are the ones people scan for first, so surface up to 4 of them.
  const PROFILE_STAT_SECTIONS = ['Capital & Workers', 'Workers', 'Production'];

  // Opens a read-only, full-record profile view for a single record — company header,
  // quick-glance stats and mini map on the left, all fields grouped by section on the right.
  function openRecordProfile(dept, idx){
    const d = DEPARTMENTS[dept];
    const rec = state.records[dept][idx];
    if(!rec) return;

    const title = rec['Company Name (Khmer)'] || rec['Company Name (English)'] || ('Record #'+(idx+1));
    const breadcrumbParts = ['Village','Commune','District'].map(k=>rec[k]).filter(v=>v!=null && v!=='');

    const sections = {}; const order = [];
    d.fields.forEach(f=>{
      const sec = f.section || 'Other';
      if(!sections[sec]){ sections[sec]=[]; order.push(sec); }
      sections[sec].push(f);
    });
    const statFields = d.fields.filter(f=> f.type==='number' && PROFILE_STAT_SECTIONS.indexOf(f.section)>-1).slice(0,4);

    const lat = numVal(rec['Latitude']), lng = numVal(rec['Longitude']);
    const hasMap = !!(lat && lng);

    let sectionsHtml = '';
    order.forEach(sec=>{
      sectionsHtml += '<div class="pgs-profile-section">'+
        '<div class="pgs-profile-section-head"><span class="dot" style="background:'+d.colorHex+';"></span>'+escapeHtml(sec)+'</div>'+
        '<div class="pgs-profile-grid">'+
        sections[sec].map(f=>{
          const v = rec[f.key];
          return '<div class="pgs-profile-field"><div class="k">'+escapeHtml(f.label)+'</div><div class="v">'+(v==null||v===''?'—':escapeHtml(String(v)))+'</div></div>';
        }).join('')+
        '</div></div>';
    });

    const gmapsUrl = hasMap ? 'https://www.google.com/maps/search/?api=1&query='+lat+','+lng : null;

    const overlay = document.createElement('div');
    overlay.className = 'pgs-profile-overlay';
    overlay.innerHTML =
      '<div class="pgs-profile-modal">'+
        '<div class="pgs-profile-header">'+
          '<div class="pgs-profile-eyebrow">'+escapeHtml(PROFILE_EYEBROW[dept]||d.short)+'</div>'+
          '<h2 class="pgs-profile-title">'+escapeHtml(title)+'</h2>'+
          (breadcrumbParts.length ? '<div class="pgs-profile-breadcrumb">'+breadcrumbParts.map(escapeHtml).join(' • ')+'</div>' : '')+
          '<button class="pgs-profile-close" id="pgsProfileClose" aria-label="Close">✕</button>'+
        '</div>'+
        '<div class="pgs-profile-body">'+
          '<div class="pgs-profile-sidebar">'+
            '<div class="pgs-profile-badgecard">'+
              '<div class="pgs-profile-recno">RECORD #'+(idx+1)+'</div>'+
              '<span class="pgs-profile-status"><span class="dot"></span>Active record</span>'+
            '</div>'+
            (breadcrumbParts.length ? '<div class="pgs-profile-sidelabel">REGISTERED LOCATION</div><div class="pgs-profile-sidevalue">'+
              (hasMap ? '<a href="'+gmapsUrl+'" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;border-bottom:1px dashed '+d.colorHex+';">'+breadcrumbParts.map(escapeHtml).join(' • ')+'</a>' : breadcrumbParts.map(escapeHtml).join(' • '))+
              '</div>' : '')+
            statFields.map(f=>{
              const v = rec[f.key];
              return '<div class="pgs-profile-stat" style="border-left-color:'+d.colorHex+';"><div class="k">'+escapeHtml(f.label)+'</div><div class="v">'+(v==null||v===''?'—':fmt(numVal(v)))+'</div></div>';
            }).join('')+
            (hasMap ?
              '<div class="pgs-profile-map-wrap">'+
                '<div class="pgs-profile-minimap" id="pgsProfileMap"></div>'+
                '<a class="pgs-profile-map-link" href="'+gmapsUrl+'" target="_blank" rel="noopener noreferrer">📍 បើកក្នុង Google Maps ↗</a>'+
              '</div>'+
              '<div class="pgs-profile-coords">'+lat.toFixed(6)+', '+lng.toFixed(6)+'</div>'
            : '')+
          '</div>'+
          '<div class="pgs-profile-main">'+sectionsHtml+'</div>'+
        '</div>'+
      '</div>';
    document.body.appendChild(overlay);

    let miniMap = null;
    if(hasMap){
      miniMap = L.map('pgsProfileMap', { zoomControl:false, attributionControl:false, dragging:false, scrollWheelZoom:false, doubleClickZoom:false, touchZoom:false }).setView([lat,lng], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:18 }).addTo(miniMap);
      L.marker([lat,lng], { icon: makeFactoryIcon(d.colorHex) }).addTo(miniMap)
        .bindPopup(escapeHtml(title), { closeButton:false, offset:[0,-30] }).openPopup();
      const mapEl = document.getElementById('pgsProfileMap');
      mapEl.style.cursor = 'pointer';
      mapEl.addEventListener('click', ()=> window.open(gmapsUrl, '_blank', 'noopener,noreferrer'));
      setTimeout(()=>{ if(miniMap) miniMap.invalidateSize(); }, 60);
    }

    function close(){
      if(miniMap){ miniMap.remove(); miniMap=null; }
      overlay.remove();
      document.removeEventListener('keydown', onKey);
    }
    function onKey(e){ if(e.key==='Escape') close(); }
    document.addEventListener('keydown', onKey);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
    document.getElementById('pgsProfileClose').onclick = close;
  }

  function renderMapView(){
    bodyEl.innerHTML = '';
    const allList = filteredRecords('misti');

    // ---- District / Commune filter row ----
    // District options come from the full (date-filtered) list; Commune options are
    // narrowed to whichever district is currently selected (or all districts if none picked).
    const districts = [...new Set(allList.map(r=> (r['District']||'').toString().trim()).filter(Boolean))].sort();
    if(state.mapDistrict && districts.indexOf(state.mapDistrict)===-1) state.mapDistrict='';
    const communeSource = state.mapDistrict ? allList.filter(r=> (r['District']||'').toString().trim()===state.mapDistrict) : allList;
    const communes = [...new Set(communeSource.map(r=> (r['Commune']||'').toString().trim()).filter(Boolean))].sort();
    if(state.mapCommune && communes.indexOf(state.mapCommune)===-1) state.mapCommune='';

    const list = allList.filter(r=>{
      if(state.mapDistrict && (r['District']||'').toString().trim()!==state.mapDistrict) return false;
      if(state.mapCommune && (r['Commune']||'').toString().trim()!==state.mapCommune) return false;
      return true;
    });

    const locFilterRow = document.createElement('div');
    locFilterRow.style.cssText='display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;';
    locFilterRow.innerHTML =
      '<label style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--navy-dark);">ស្រុក</label>'+
      '<select id="pgsMapDistrict" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:inherit;background:#fff;'+(state.mapDistrict?'border-color:var(--gold);background:#FBF3DC;':'')+'">'+
        '<option value="">ទាំងអស់</option>'+
        districts.map(d=>'<option value="'+d+'"'+(d===state.mapDistrict?' selected':'')+'>'+d+'</option>').join('')+
      '</select>'+
      '<label style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--navy-dark);">ឃុំ</label>'+
      '<select id="pgsMapCommune" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:inherit;background:#fff;'+(state.mapCommune?'border-color:var(--gold);background:#FBF3DC;':'')+'">'+
        '<option value="">ទាំងអស់</option>'+
        communes.map(c=>'<option value="'+c+'"'+(c===state.mapCommune?' selected':'')+'>'+c+'</option>').join('')+
      '</select>'+
      ((state.mapDistrict||state.mapCommune)?'<button class="pgs-btn pgs-btn-ghost pgs-btn-sm" id="pgsMapLocClear">សម្អាតតម្រង</button>':'')+
      '<span style="font-size:12px;color:#8A8474;">'+list.length+' នៃ '+allList.length+' រោងចក្រ</span>';
    bodyEl.appendChild(locFilterRow);

    document.getElementById('pgsMapDistrict').addEventListener('change', e=>{ state.mapDistrict = e.target.value; state.mapCommune=''; renderMapView(); });
    document.getElementById('pgsMapCommune').addEventListener('change', e=>{ state.mapCommune = e.target.value; renderMapView(); });
    const locClearBtn = document.getElementById('pgsMapLocClear');
    if(locClearBtn) locClearBtn.addEventListener('click', ()=>{ state.mapDistrict=''; state.mapCommune=''; renderMapView(); });

    const cat = categorize(list, 'Product Type', 5);

    const legend = document.createElement('div'); legend.className='pgs-map-legend';
    cat.labels.forEach((label, i)=>{
      const color = CATEGORY_PALETTE[i % CATEGORY_PALETTE.length];
      const lbl = document.createElement('label');
      lbl.innerHTML = '<input type="checkbox" checked data-cat="'+i+'"> <span class="pgs-legend-dot" style="background:'+color+'"></span> '+label;
      legend.appendChild(lbl);
    });
    bodyEl.appendChild(legend);

    const basemapRow = document.createElement('div'); basemapRow.style.cssText='display:flex; gap:8px; margin-bottom:10px;';
    basemapRow.innerHTML =
      '<button class="pgs-btn pgs-btn-primary pgs-btn-sm" id="pgsBasemapStreet">Map</button>'+
      '<button class="pgs-btn pgs-btn-ghost pgs-btn-sm" id="pgsBasemapSat">Satellite</button>';
    bodyEl.appendChild(basemapRow);

    const note = document.createElement('div'); note.className='hint'; note.style.marginTop='0';
    note.textContent = 'MISTI factories only, colored by business/product category. Pins without an exact GPS entry are placed at their district center ("approximate").';
    bodyEl.appendChild(note);

    const mapDiv = document.createElement('div'); mapDiv.id='pgsMap'; mapDiv.style.marginTop='10px';
    bodyEl.appendChild(mapDiv);

    setTimeout(()=>{
      if(state.map){ state.map.remove(); state.map=null; }
      const map = L.map('pgsMap').setView([11.02, 104.75], 10);

      const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'&copy; OpenStreetMap contributors', maxZoom:18 });
      const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution:'Tiles &copy; Esri', maxZoom:18 });
      streetLayer.addTo(map);

      const streetBtn = document.getElementById('pgsBasemapStreet');
      const satBtn = document.getElementById('pgsBasemapSat');
      streetBtn.onclick = ()=>{ map.removeLayer(satLayer); streetLayer.addTo(map); streetBtn.className='pgs-btn pgs-btn-primary pgs-btn-sm'; satBtn.className='pgs-btn pgs-btn-ghost pgs-btn-sm'; };
      satBtn.onclick = ()=>{ map.removeLayer(streetLayer); satLayer.addTo(map); satBtn.className='pgs-btn pgs-btn-primary pgs-btn-sm'; streetBtn.className='pgs-btn pgs-btn-ghost pgs-btn-sm'; };

      state.map = map;
      state.mapLayers = {};
      cat.labels.forEach((label,i)=>{ state.mapLayers[i] = L.layerGroup().addTo(map); });

      list.forEach(r=>{
        const lat = r['Latitude'], lng = r['Longitude'];
        if(lat==null || lng==null) return;
        const idx = cat.of(r['Product Type']);
        const color = CATEGORY_PALETTE[idx % CATEGORY_PALETTE.length];
        const marker = L.marker([lat,lng], { icon: makeFactoryIcon(color) });
        const name = r['Company Name (Khmer)'] || '(unnamed)';
        const dist = r['District'] || '';
        const productType = r['Product Type'] || '';
        const workers = r['Total Workers']!=null ? r['Total Workers'] : '';
        marker.bindPopup('<b>'+name+'</b><br>'+dist+(productType?'<br>'+productType:'')+(workers!==''?'<br>Workers: '+workers:''));
        marker.addTo(state.mapLayers[idx]);
      });

      legend.querySelectorAll('input[type=checkbox]').forEach(cb=>{
        cb.addEventListener('change', ()=>{
          const i = cb.getAttribute('data-cat');
          if(cb.checked) state.mapLayers[i].addTo(map); else map.removeLayer(state.mapLayers[i]);
        });
      });
    }, 30);
  }

  function departmentStats(deptKey){
    const d = DEPARTMENTS[deptKey];
    const list = state.records[deptKey]||[];
    const distCounts = {};
    list.forEach(r=>{ const dv=(r[d.districtKey]||'').toString().trim(); if(dv) distCounts[dv]=(distCounts[dv]||0)+1; });
    return { count:list.length, districts:Object.keys(distCounts).length };
  }

  // ---------- DEPARTMENT VIEW (table + form + CSV, or read-only summary for governor) ----------
  function renderDeptView(dept){
    const d = DEPARTMENTS[dept];
    const readOnly = state.role === 'governor';
    bodyEl.innerHTML = '';

    if(readOnly){
      renderDeptDashboard(dept);
      const sep = document.createElement('div'); sep.style.cssText='height:1px;background:var(--line);margin:20px 0;';
      bodyEl.appendChild(sep);
      const label = document.createElement('div'); label.className='pgs-form-title'; label.textContent = 'All '+d.short+' records';
      bodyEl.appendChild(label);
    } else {
      const ioRow = document.createElement('div');
      ioRow.className = 'pgs-io-row';
      ioRow.innerHTML =
        '<div class="pgs-io-card">'+
          '<h4>Manual entry</h4><p>Add or edit one record at a time using a form built from this department&#39;s fields.</p>'+
          '<button class="pgs-btn pgs-btn-primary pgs-btn-sm" id="pgsAddBtn">+ Add record</button>'+
        '</div>'+
        '<div class="pgs-io-card">'+
          '<h4>Bulk upload (CSV)</h4><p>Download the template, fill it in Excel/Sheets, then upload it here to add many records at once.</p>'+
          '<button class="pgs-btn pgs-btn-ghost pgs-btn-sm" id="pgsTemplateBtn">Download template</button> '+
          '<input type="file" accept=".csv" id="pgsCsvInput" class="pgs-file-input" style="margin-top:8px;display:block;">'+
          '<div class="pgs-upload-result" id="pgsUploadResult"></div>'+
        '</div>'+
        '<div class="pgs-io-card">'+
          '<h4>Connect a system (API)</h4><p>For a live feed from your own software, have your IT team POST records to your backend using this shape once deployed:</p>'+
          '<div class="pgs-api-box">POST /api/departments/'+dept+'/records\nContent-Type: application/json\n\n{ '+d.fields.slice(0,3).map(f=>'"'+f.key+'": "..."').join(', ')+', ... }</div>'+
        '</div>';
      bodyEl.appendChild(ioRow);
    }

    const toolbar = document.createElement('div');
    toolbar.className = 'pgs-toolbar';
    toolbar.innerHTML = '<input class="pgs-search" id="pgsSearch" type="text" placeholder="Search records..."> '+
      '<button class="pgs-btn pgs-btn-ghost" id="pgsExportBtn">Export CSV</button>'+
      '<span class="pgs-status" id="pgsStatus"></span>';
    bodyEl.appendChild(toolbar);

    const formWrap = document.createElement('div');
    formWrap.className = 'pgs-form-wrap';
    formWrap.id = 'pgsFormWrap';
    formWrap.innerHTML = '<div class="pgs-form-title" id="pgsFormTitle">Add new record</div><form id="pgsForm"></form>';
    if(!readOnly) bodyEl.appendChild(formWrap);

    const tableWrap = document.createElement('div');
    tableWrap.className = 'pgs-table-wrap';
    tableWrap.innerHTML = '<div id="pgsTableHost"></div>';
    bodyEl.appendChild(tableWrap);

    const countLine = document.createElement('div');
    countLine.className = 'pgs-count-line'; countLine.id='pgsCountLine';
    bodyEl.appendChild(countLine);

    const statusEl = document.getElementById('pgsStatus');
    const searchEl = document.getElementById('pgsSearch');
    const formEl = readOnly ? null : document.getElementById('pgsForm');
    const formTitleEl = readOnly ? null : document.getElementById('pgsFormTitle');
    const tableHost = document.getElementById('pgsTableHost');

    function setStatus(msg, isErr){
      statusEl.textContent = msg||''; statusEl.classList.toggle('err', !!isErr);
      if(msg) setTimeout(()=>{ if(statusEl.textContent===msg) statusEl.textContent=''; }, 2500);
    }

    function buildForm(){
      const sections = {};
      d.fields.forEach(f=>{ if(f.key==='No.') return; const s=f.section||'Details'; (sections[s]=sections[s]||[]).push(f); });
      formEl.innerHTML = '';
      Object.keys(sections).forEach(secName=>{
        const fs = document.createElement('fieldset'); fs.className='pgs-section';
        const legend = document.createElement('legend'); legend.textContent = secName; fs.appendChild(legend);
        const grid = document.createElement('div'); grid.className='pgs-grid';
        sections[secName].forEach(f=>{
          const wrap = document.createElement('div'); wrap.className='pgs-field';
          const label = document.createElement('label'); label.textContent=f.label; wrap.appendChild(label);
          const input = document.createElement('input'); input.type='text'; input.name=f.key; input.autocomplete='off';
          wrap.appendChild(input); grid.appendChild(wrap);
        });
        fs.appendChild(grid); formEl.appendChild(fs);
      });
      const actions = document.createElement('div'); actions.className='pgs-form-actions';
      actions.innerHTML = '<button type="submit" class="pgs-btn pgs-btn-primary">Save record</button>'+
        '<button type="button" class="pgs-btn pgs-btn-ghost" id="pgsCancelBtn">Cancel</button>';
      formEl.appendChild(actions);
      formEl.querySelector('#pgsCancelBtn').onclick = ()=>{ formWrap.classList.remove('open'); state.editIndex=null; };
    }

    // Next "No." continues from whatever the highest existing No. is in this department, so
    // staff never have to type or coordinate record numbers themselves.
    function nextRecordNo(){
      const list = state.records[dept] || [];
      let max = 0;
      list.forEach(r=>{ const n = Number(r['No.']); if(!isNaN(n) && n>max) max = n; });
      return max + 1;
    }

    function openFormForAdd(){
      state.editIndex = null; formTitleEl.textContent = 'Add new record — '+d.label;
      buildForm(); formEl.reset(); formWrap.classList.add('open');
      formWrap.scrollIntoView({behavior:'smooth', block:'nearest'});
    }
    function openFormForEdit(idx){
      state.editIndex = idx; formTitleEl.textContent = 'Edit record — '+d.label;
      buildForm();
      const rec = state.records[dept][idx];
      d.fields.forEach(f=>{ const el=formEl.elements[f.key]; if(el && rec[f.key]!=null) el.value=rec[f.key]; });
      formWrap.classList.add('open');
      formWrap.scrollIntoView({behavior:'smooth', block:'nearest'});
    }

    if(!readOnly){
      formEl.addEventListener('submit', async (e)=>{
        e.preventDefault();

        // Require every field to be filled before saving — remind the user which ones are still empty.
        const missing = [];
        d.fields.forEach(f=>{
          if(f.key==='No.') return; // auto-generated, not user-entered
          const el = formEl.elements[f.key];
          if(el) el.classList.remove('pgs-field-error');
          const v = el ? el.value.trim() : '';
          if(v===''){ missing.push(f.label); if(el) el.classList.add('pgs-field-error'); }
        });
        if(missing.length){
          setStatus('Please fill in all fields before saving. Missing: '+missing.join(', '), true);
          return;
        }

        const rec = {};
        d.fields.forEach(f=>{
          if(f.key==='No.') return; // handled separately below — auto-generated, not user-entered
          const el = formEl.elements[f.key]; let v = el?el.value:'';
          if(f.type==='number'){ v = v===''?null:(isNaN(Number(v))?v:Number(v)); }
          rec[f.key] = v===''?null:v;
        });
        if(state.editIndex!=null){
          rec['No.'] = state.records[dept][state.editIndex]['No.']; // keep original number on edit
          Object.assign(state.records[dept][state.editIndex], rec);
        } else {
          rec['No.'] = nextRecordNo();
          state.records[dept].push(rec);
        }
        const ok = await saveDept(dept);
        setStatus(ok?'Saved':'Save failed — try again', !ok);
        formWrap.classList.remove('open'); state.editIndex=null;
        renderTabs(); renderTableOnly();
      });

      document.getElementById('pgsAddBtn').onclick = openFormForAdd;

      document.getElementById('pgsTemplateBtn').onclick = ()=>{
        const headers = d.fields.map(f=>f.label);
        const example = d.fields.map(f=> f.type==='number' ? '0' : 'example');
        const csv = '\uFEFF'+headers.join(',')+'\n'+example.join(',');
        const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
        const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
        a.download = dept+'_template.csv'; a.click();
      };

      document.getElementById('pgsCsvInput').addEventListener('change', (e)=>{
        const file = e.target.files[0];
        const resultEl = document.getElementById('pgsUploadResult');
        if(!file) return;
        Papa.parse(file, {
          header:true, skipEmptyLines:true,
          complete: async function(results){
            const labelToKey = {};
            d.fields.forEach(f=> labelToKey[f.label.trim().toLowerCase()] = f.key);
            let added=0, skipped=0;
            results.data.forEach(row=>{
              const rec = {}; let any=false;
              Object.keys(row).forEach(h=>{
                const key = labelToKey[h.trim().toLowerCase()] || (d.fields.some(f=>f.key===h)? h : null);
                if(key){ let v = row[h]; if(v==='') v=null; rec[key]=v; if(v!=null) any=true; }
              });
              if(any){ state.records[dept].push(rec); added++; } else { skipped++; }
            });
            if(added>0){ await saveDept(dept); }
            resultEl.textContent = added+' record(s) added'+(skipped?', '+skipped+' empty row(s) skipped':'')+'.';
            resultEl.style.color = added>0 ? 'var(--green)' : 'var(--maroon)';
            e.target.value = '';
            renderTabs(); renderTableOnly();
          }
        });
      });
    }

    document.getElementById('pgsExportBtn').onclick = ()=>{
      const rows = getFiltered();
      const headers = d.fields.map(f=>f.label);
      const lines = [headers.join(',')];
      rows.forEach(r=>{
        const line = d.fields.map(f=>{
          let v = r[f.key]; if(v==null) v='';
          v = String(v).replace(/"/g,'""');
          if(v.indexOf(',')>-1 || v.indexOf('\n')>-1) v='"'+v+'"';
          return v;
        }).join(',');
        lines.push(line);
      });
      const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
      const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download = dept+'_records.csv'; a.click();
    };

    searchEl.addEventListener('input', ()=>{ state.search = searchEl.value.toLowerCase(); renderTableOnly(); });

    function getFiltered(){
      const list = filteredRecords(dept);
      if(!state.search) return list;
      return list.filter(r=> Object.values(r).some(v=> v!=null && String(v).toLowerCase().indexOf(state.search)>-1));
    }

    function renderTableOnly(){
      const rows = getFiltered();
      document.getElementById('pgsCountLine').textContent = rows.length+' of '+filteredRecords(dept).length+' records shown'+((state.dateFrom||state.dateTo)?' (date filter active)':'');
      if(rows.length===0){ tableHost.innerHTML = '<div class="pgs-empty">No records yet.'+(readOnly?'':' Add one manually or upload a CSV.')+'</div>'; return; }
      const table = document.createElement('table'); table.className='pgs-table';
      const thead = document.createElement('thead'); const trh = document.createElement('tr');
      d.fields.forEach(f=>{ const th=document.createElement('th'); th.textContent=f.label; trh.appendChild(th); });
      const thA = document.createElement('th'); thA.textContent='សកម្មភាព'; trh.appendChild(thA);
      thead.appendChild(trh); table.appendChild(thead);
      const tbody = document.createElement('tbody');
      const fullList = state.records[dept];
      rows.forEach(r=>{
        const realIdx = fullList.indexOf(r);
        const tr = document.createElement('tr');
        d.fields.forEach(f=>{ const td=document.createElement('td'); const v=r[f.key]; td.textContent=v==null?'':v; td.title=td.textContent; tr.appendChild(td); });
        const tdA = document.createElement('td'); tdA.className='pgs-actions-cell';
        const viewBtn = document.createElement('button'); viewBtn.className='pgs-btn pgs-btn-ghost pgs-btn-sm'; viewBtn.textContent='View';
        viewBtn.onclick = ()=> openRecordProfile(dept, realIdx);
        tdA.appendChild(viewBtn);
        if(!readOnly){
          const editBtn = document.createElement('button'); editBtn.className='pgs-btn pgs-btn-ghost pgs-btn-sm'; editBtn.textContent='Edit';
          editBtn.onclick = ()=> openFormForEdit(realIdx);
          const delBtn = document.createElement('button'); delBtn.className='pgs-btn pgs-btn-danger pgs-btn-sm'; delBtn.textContent='Delete';
          delBtn.onclick = async ()=>{ if(!confirm('Delete this record?')) return; fullList.splice(realIdx,1); await saveDept(dept); renderTabs(); renderTableOnly(); };
          tdA.appendChild(editBtn); tdA.appendChild(delBtn);
        }
        tr.appendChild(tdA);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody); tableHost.innerHTML=''; tableHost.appendChild(table);
    }

    renderTableOnly();
  }

  (async function init(){
    for(const dept of DEPT_KEYS){ await loadDept(dept); }
    // Chrome renders after a successful sign-in (see loginForm submit handler above).
  })();
})();
</script>
